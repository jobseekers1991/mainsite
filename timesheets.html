<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timesheets — Jobseekers.ph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dash-body">

<div class="dash-wrapper">
  <aside class="dash-sidebar" id="dashSidebar" data-role="client" data-active="timesheets"></aside>
  <div class="dash-overlay" id="dashOverlay"></div>

  <div class="dash-main">
    <header class="dash-topbar" id="dashTopbar"></header>
<script src="js/va-data.js"></script>
<script src="js/app-data.js"></script>
<script src="js/dash.js"></script>

    <main class="dash-content">
<div class="dash-page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap;">
  <div>
    <h1>Timesheets</h1>
    <p>Review hours day by day. Approving locks them for the next invoice.</p>
  </div>
  <div style="display:flex; gap:0.5rem;">
    <button class="btn btn-outline-primary" id="approveAll"><i class="fas fa-check-double"></i> Approve all pending</button>
  </div>
</div>

<div class="stat-card-grid" id="tsStats"></div>

<div class="dash-card" style="margin:1.25rem 0; padding:1rem;">
  <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
    <label class="form-label" style="margin:0;">VA</label>
    <select id="vaSel" class="form-control" style="max-width:260px;"></select>
    <label class="form-label" style="margin:0;">Period</label>
    <select id="periodSel" class="form-control" style="max-width:200px;">
      <option value="7">Last 7 days</option>
      <option value="14">Last 14 days</option>
      <option value="30">Last 30 days</option>
      <option value="all">All</option>
    </select>
    <select id="filterSel" class="filter-sel" style="margin-left:auto;">
      <option value="all">All entries</option>
      <option value="pending">Pending only</option>
      <option value="approved">Approved only</option>
    </select>
  </div>
</div>

<div id="weekSummary"></div>
<div class="dash-card" style="margin-top:1rem;"><div class="table-responsive"><table class="dash-table" style="width:100%;"><thead><tr><th>Day</th><th>VA</th><th style="text-align:right;">Hours</th><th>Note</th><th>Status</th><th></th></tr></thead><tbody id="tsBody"></tbody></table></div></div>

    </main>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let vaFilter = 'all';
  let period = 7;
  let filter = 'all';
  let sheets = [];
  const DAY_MS_LOCAL = 86400000;
  const money = n => '$' + Number(n || 0).toFixed(2);
  const vaName = t => ((t.vaFirstName || '') + ' ' + (t.vaLastName || '')).trim() || 'VA';

  async function load() {
    try {
      const r = await fetch('/api/timesheets', { cache: 'no-store' });
      if (r.status === 401) { location.href = 'auth'; return; }
      const data = await r.json();
      sheets = data.timesheets || [];
    } catch (e) { sheets = []; }
    renderAll();
  }

  function weekAgeDays(ws) {
    // ws is YYYY-MM-DD (Monday of that week). Days since start of week.
    const t = new Date(ws + 'T00:00:00Z').getTime();
    return (Date.now() - t) / DAY_MS_LOCAL;
  }

  function vaList() {
    const map = new Map();
    for (const s of sheets) if (s.vaId) map.set(s.vaId, vaName(s));
    return [...map.entries()];
  }

  function renderStats() {
    const pending = sheets.filter(s => s.status === 'pending');
    const pendingHours = pending.reduce((s, x) => s + x.hours, 0);
    const recent = sheets.filter(s => weekAgeDays(s.weekStart) <= 7);
    const weekHours = recent.reduce((s, x) => s + x.hours, 0);
    const weekCost = recent.reduce((s, x) => s + x.hours * Number(x.rate || 0), 0);
    const activeVas = new Set(recent.map(s => s.vaId)).size;
    const stat = (label, num, icon, color, sub) => `
      <div class="stat-card">
        <div class="stat-card-top"><span class="stat-card-label">${label}</span><div class="stat-card-icon" style="background:${color}1a; color:${color};"><i class="fas ${icon}"></i></div></div>
        <div class="stat-card-num">${num}</div>
        <div class="stat-card-change" style="color:var(--text-light);">${sub}</div>
      </div>`;
    $('tsStats').innerHTML =
      stat('Pending approval', pending.length, 'fa-hourglass-half', '#F59E0B', `${pendingHours.toFixed(1)} hrs waiting`) +
      stat('Hours this week', weekHours.toFixed(1), 'fa-clock', '#4F46E5', 'across your team') +
      stat('Cost this week', money(weekCost), 'fa-dollar-sign', '#10B981', 'at contract rates') +
      stat('Active VAs', activeVas, 'fa-user-check', '#EC4899', 'logging time');
  }

  function renderControls() {
    $('vaSel').innerHTML = '<option value="all">All VAs</option>' + vaList().map(([id, name]) => `<option value="${id}">${esc(name)}</option>`).join('');
    $('vaSel').value = vaFilter;
    $('periodSel').value = String(period);
    $('filterSel').value = filter;
  }

  function filtered() {
    return sheets.filter(s => {
      if (vaFilter !== 'all' && s.vaId !== vaFilter) return false;
      if (period !== 'all' && weekAgeDays(s.weekStart) > Number(period)) return false;
      if (filter === 'pending' && s.status !== 'pending') return false;
      if (filter === 'approved' && s.status !== 'approved') return false;
      return true;
    }).sort((a, b) => b.weekStart.localeCompare(a.weekStart));
  }

  function renderWeekSummary() { $('weekSummary').innerHTML = ''; }

  function renderTable() {
    const list = filtered();
    $('tsBody').innerHTML = list.map(s => {
      const pill = s.status === 'approved' ? '<span class="status-pill hired">Approved</span>'
        : s.status === 'rejected' ? '<span class="status-pill rejected">Rejected</span>'
        : '<span class="status-pill pending">Pending</span>';
      return `<tr>
        <td style="white-space:nowrap;">Week of ${esc(s.weekStart)}</td>
        <td>${esc(vaName(s))} <span style="font-size:0.72rem; color:var(--text-light);">· $${Number(s.rate).toFixed(2)}/hr</span></td>
        <td style="text-align:right; font-weight:700;">${s.hours.toFixed(1)}</td>
        <td style="color:var(--text-light); font-size:0.85rem;">${esc(s.summary || '')}</td>
        <td>${pill}</td>
        <td style="text-align:right; white-space:nowrap;">${s.status === 'pending'
          ? `<button class="btn btn-primary btn-xs" data-act="approve" data-id="${s.id}">Approve</button> <button class="btn btn-ghost btn-xs" data-act="reject" data-id="${s.id}">Reject</button>`
          : ''}</td>
      </tr>`;
    }).join('') || '<tr><td colspan="6" style="text-align:center; color:var(--text-light); padding:1.5rem;">No entries for this view</td></tr>';
  }

  function renderAll() { renderStats(); renderControls(); renderWeekSummary(); renderTable(); }

  $('vaSel').addEventListener('change', e => { vaFilter = e.target.value; renderTable(); });
  $('periodSel').addEventListener('change', e => { period = e.target.value === 'all' ? 'all' : Number(e.target.value); renderTable(); });
  $('filterSel').addEventListener('change', e => { filter = e.target.value; renderTable(); });

  async function patchStatus(id, status) {
    const r = await fetch('/api/timesheets/' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
    return r.ok;
  }

  $('approveAll').addEventListener('click', async () => {
    const pending = sheets.filter(s => s.status === 'pending');
    if (!pending.length) { showToast && showToast('Nothing pending'); return; }
    await Promise.all(pending.map(s => patchStatus(s.id, 'approved')));
    await load();
    showToast && showToast(`${pending.length} entries approved`);
  });

  $('tsBody').addEventListener('click', async e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const id = btn.dataset.id;
    const act = btn.dataset.act;
    if (act === 'approve') { await patchStatus(id, 'approved'); showToast && showToast('Approved'); }
    if (act === 'reject')  { await patchStatus(id, 'rejected'); showToast && showToast('Rejected'); }
    await load();
  });

  load();
</script>
</body>
</html>
