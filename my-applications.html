<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Applications — Jobseekers.ph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dash-body">

<div class="dash-wrapper">
  <aside class="dash-sidebar" id="dashSidebar" data-role="va" data-active="applications"></aside>
  <div class="dash-overlay" id="dashOverlay"></div>

  <div class="dash-main">
    <header class="dash-topbar" id="dashTopbar"></header>
<script src="js/dash.js"></script>

    <main class="dash-content">
<div class="dash-page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap;">
  <div>
    <h1>My Applications</h1>
    <p>Track every job you've applied to, accept trial offers, and follow up with clients.</p>
  </div>
  <a href="browse-jobs" class="btn btn-primary"><i class="fas fa-search"></i> Find more jobs</a>
</div>

<div class="stat-card-grid" id="appStats"></div>

<div class="seg-tabs" id="appTabs" style="margin-top:1.5rem;"></div>
<div id="appList"></div>
    </main>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
  const fmtDay = t => new Date(Number(t)).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

  const APP_STATUS = {
    submitted:  { label: 'Submitted',       pill: 'pending' },
    viewed:     { label: 'Viewed',          pill: 'viewed' },
    interview:  { label: 'Interview',       pill: 'active' },
    trial:      { label: 'Trial offer',     pill: 'hired' },
    trialing:   { label: 'Trial in progress', pill: 'active' },
    hired:      { label: 'Hired',           pill: 'hired' },
    rejected:   { label: 'Not selected',    pill: 'rejected' },
    withdrawn:  { label: 'Withdrawn',       pill: 'closed' },
  };

  const NEXT_STEP = {
    submitted:  'Waiting for the client to review. Most clients reply within 3 days.',
    viewed:     'The client viewed your application. A short, polite follow-up can help.',
    interview:  'The client wants to talk. Reply from your Messages tab.',
    trial:      'You have a paid-trial offer. Review the scope and accept to start.',
    trialing:   'Your paid trial is live.',
    hired:      'You\'re hired! Congratulations.',
    rejected:   'The client went with someone else. Keep going — the next one could be yours.',
    withdrawn:  'You withdrew this application.',
  };

  const GROUPS = {
    all:    { label: 'All',    match: () => true },
    active: { label: 'Active', match: a => ['submitted', 'viewed', 'interview'].includes(a.status) },
    trial:  { label: 'Trials', match: a => ['trial', 'trialing'].includes(a.status) },
    hired:  { label: 'Hired',  match: a => a.status === 'hired' },
    closed: { label: 'Closed', match: a => ['rejected', 'withdrawn'].includes(a.status) },
  };

  let apps = [];
  let filter = 'all';
  let me = null;

  async function load() {
    try {
      const meRes = await fetch('/api/me');
      if (meRes.status !== 200) { location.href = 'auth?next=my-applications'; return; }
      me = (await meRes.json()).user;
      if (!me || me.role !== 'va') {
        document.querySelector('.dash-content').innerHTML = '<div class="empty-state"><i class="fas fa-user-lock"></i>This page is for VA accounts.</div>';
        return;
      }
      const res = await fetch('/api/applications');
      const data = await res.json();
      if (data.ok) apps = data.applications || [];
    } catch (err) {
      console.error('[my-applications]', err);
    }
    renderAll();
  }

  function renderStats() {
    const stat = (label, num, icon, color, sub) => `
      <div class="stat-card">
        <div class="stat-card-top"><span class="stat-card-label">${label}</span><div class="stat-card-icon" style="background:${color}1a; color:${color};"><i class="fas ${icon}"></i></div></div>
        <div class="stat-card-num">${num}</div>
        <div class="stat-card-change" style="color:var(--text-light);">${sub}</div>
      </div>`;
    document.getElementById('appStats').innerHTML =
      stat('Active',     apps.filter(GROUPS.active.match).length, 'fa-paper-plane', '#4F46E5', 'waiting on clients') +
      stat('Interviews', apps.filter(a => a.status === 'interview').length, 'fa-video', '#0EA5E9', 'check Messages') +
      stat('Trial offers', apps.filter(a => a.status === 'trial').length, 'fa-flask', '#10B981', 'paid, 1–3 days') +
      stat('Hired',      apps.filter(a => a.status === 'hired').length, 'fa-check-circle', '#22C55E', 'active engagements');
  }

  function renderTabs() {
    document.getElementById('appTabs').innerHTML = Object.entries(GROUPS).map(([key, g]) =>
      `<button type="button" data-filter="${key}" class="${key === filter ? 'active' : ''}">${g.label}<span>${apps.filter(g.match).length}</span></button>`).join('');
  }

  function renderList() {
    const list = apps.filter(a => GROUPS[filter].match(a));
    if (!list.length) {
      document.getElementById('appList').innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i>No applications here yet. <a href="browse-jobs" style="color:var(--primary); font-weight:600;">Browse jobs</a></div>`;
      return;
    }
    document.getElementById('appList').innerHTML = list.map(a => {
      const st = APP_STATUS[a.status] || { label: a.status, pill: 'pending' };
      const closed = ['rejected', 'withdrawn'].includes(a.status);
      const jobClosed = a.jobStatus && a.jobStatus !== 'open';
      return `
        <div class="item-card${closed ? ' dim' : ''}">
          <div class="item-head">
            <div class="job-logo" style="background:rgba(79,70,229,0.08); width:48px; height:48px;"><i class="fas fa-briefcase" style="color:var(--primary);"></i></div>
            <div class="grow">
              <h3><a href="job?id=${encodeURIComponent(a.jobId)}">${esc(a.jobTitle || 'Job')}</a></h3>
              <p>${esc(a.jobCompany || 'Private client')} · Applied ${fmtDay(a.createdAt)}${jobClosed ? ' · <span class="warn">Job closed</span>' : ''}</p>
            </div>
            <span class="status-pill ${a.status === 'trial' ? 'trial' : st.pill}">${st.label}</span>
          </div>
          <div class="item-meta">
            <span>Your rate <strong>$${a.rate}/hr</strong></span>
            ${a.canStart ? `<span>Can start <strong>${esc(a.canStart)}</strong></span>` : ''}
            ${a.openToTrial ? '<span><i class="fas fa-flask" style="color:var(--success);"></i> Open to trial</span>' : ''}
          </div>
          <p style="font-size:0.8125rem; color:var(--text-light); margin-top:0.625rem;"><i class="fas fa-info-circle"></i> ${NEXT_STEP[a.status] || ''}</p>
          <div class="item-actions">
            <a href="job?id=${encodeURIComponent(a.jobId)}" class="btn btn-ghost btn-sm"><i class="fas fa-eye"></i> View job</a>
            ${['submitted', 'viewed'].includes(a.status) ? `<button class="btn btn-ghost btn-sm" data-act="withdraw" data-id="${a.id}" style="color:var(--danger);"><i class="fas fa-undo"></i> Withdraw</button>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  function renderAll() { renderStats(); renderTabs(); renderList(); }

  document.getElementById('appTabs').addEventListener('click', e => {
    const btn = e.target.closest('[data-filter]');
    if (btn) { filter = btn.dataset.filter; renderTabs(); renderList(); }
  });

  document.getElementById('appList').addEventListener('click', async e => {
    const btn = e.target.closest('[data-act="withdraw"]');
    if (!btn) return;
    if (btn.dataset.confirm !== '1') {
      btn.dataset.confirm = '1';
      btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Click again to withdraw';
      return;
    }
    btn.disabled = true;
    try {
      const res = await fetch('/api/applications/' + encodeURIComponent(btn.dataset.id), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'withdrawn' }),
      });
      const data = await res.json();
      if (data.ok) {
        const app = apps.find(a => a.id === btn.dataset.id);
        if (app) app.status = 'withdrawn';
        showToast('Application withdrawn.');
        renderAll();
      } else {
        showToast(data.error || 'Could not withdraw.');
        btn.disabled = false;
      }
    } catch (err) {
      showToast('Network error.');
      btn.disabled = false;
    }
  });

  load();
</script>
</body>
</html>
