<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoices — Jobseekers.ph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dash-body">

<div class="dash-wrapper">
  <aside class="dash-sidebar" id="dashSidebar" data-role="client" data-active="invoices"></aside>
  <div class="dash-overlay" id="dashOverlay"></div>

  <div class="dash-main">
    <header class="dash-topbar" id="dashTopbar"></header>
<script src="js/va-data.js"></script>
<script src="js/app-data.js"></script>
<script src="js/dash.js"></script>

    <main class="dash-content">
<div class="dash-page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap;">
  <div>
    <h1>Invoices</h1>
    <p>History of every invoice. Approve, dispute, download CSV for your bookkeeper.</p>
  </div>
  <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
    <button class="btn btn-outline-primary" id="exportCsv"><i class="fas fa-file-csv"></i> Export CSV</button>
    <a href="billing" class="btn btn-ghost"><i class="fas fa-credit-card"></i> Billing settings</a>
  </div>
</div>

<div class="stat-card-grid" id="invStats"></div>

<div class="dash-card" style="margin:1.25rem 0; padding:1rem;">
  <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
    <input type="text" id="searchInv" class="form-control" placeholder="Search invoice # or VA…" style="max-width:280px;" />
    <select id="vaSel" class="form-control" style="max-width:220px;"></select>
    <select id="periodSel" class="filter-sel" style="margin-left:auto;">
      <option value="all">All time</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
    </select>
  </div>
</div>

<div class="seg-tabs" id="statusTabs"></div>
<div class="dash-card" style="margin-top:0.75rem;"><div class="table-responsive"><table class="dash-table" style="width:100%;"><thead><tr><th>Invoice</th><th>VA</th><th>Period</th><th style="text-align:right;">Hours</th><th style="text-align:right;">Rate</th><th style="text-align:right;">Amount</th><th>Status</th><th></th></tr></thead><tbody id="invBody"></tbody></table></div></div>
    </main>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  let client = Store.get('jsph-client', seedClient);
  const save = () => { Store.set('jsph-client', client); renderDashNav(); };
  const $ = id => document.getElementById(id);
  let statusF = 'all';
  let vaF = 'all';
  let period = 'all';
  let search = '';

  const STATUSES = ['all', 'due', 'paid', 'disputed', 'refunded'];
  const STATUS_LABEL = { all: 'All', due: 'Due', paid: 'Paid', disputed: 'Disputed', refunded: 'Refunded' };
  const STATUS_PILL = { due: 'pending', paid: 'hired', disputed: 'rejected', refunded: 'closed' };

  function renderStats() {
    const due = client.invoices.filter(i => i.status === 'due');
    const paid30 = client.invoices.filter(i => i.status === 'paid').slice(0, 30);
    const dueAmt = due.reduce((s, i) => s + i.hours * i.rate, 0);
    const paidAmt = paid30.reduce((s, i) => s + i.hours * i.rate, 0);
    const flagged = client.invoices.filter(i => i.note).length;
    const stat = (label, num, icon, color, sub) => `
      <div class="stat-card">
        <div class="stat-card-top"><span class="stat-card-label">${label}</span><div class="stat-card-icon" style="background:${color}1a; color:${color};"><i class="fas ${icon}"></i></div></div>
        <div class="stat-card-num">${num}</div>
        <div class="stat-card-change" style="color:var(--text-light);">${sub}</div>
      </div>`;
    $('invStats').innerHTML =
      stat('Due', money(dueAmt), 'fa-hourglass-half', '#F59E0B', `${due.length} invoice${due.length === 1 ? '' : 's'}`) +
      stat('Paid lifetime', money(paidAmt), 'fa-check-circle', '#10B981', `${paid30.length} invoices`) +
      stat('Flagged', flagged, 'fa-exclamation-triangle', '#EF4444', 'over contract hours') +
      stat('This month', client.invoices.filter(i => true).length, 'fa-file-invoice-dollar', '#4F46E5', 'total invoices');
  }

  function renderControls() {
    const vas = [...new Set(client.invoices.map(i => i.vaId))].map(vaById);
    $('vaSel').innerHTML = '<option value="all">All VAs</option>' + vas.map(v => `<option value="${v.id}">${esc(v.name)}</option>`).join('');
    $('vaSel').value = vaF;
    $('periodSel').value = period;
    $('statusTabs').innerHTML = STATUSES.map(s => `<button type="button" data-s="${s}" class="${s === statusF ? 'active' : ''}">${STATUS_LABEL[s]}<span>${s === 'all' ? client.invoices.length : client.invoices.filter(i => i.status === s).length}</span></button>`).join('');
  }

  function filtered() {
    const q = search.trim().toLowerCase();
    return client.invoices.filter(inv => {
      if (statusF !== 'all' && inv.status !== statusF) return false;
      if (vaF !== 'all' && inv.vaId !== vaF) return false;
      // Period is approximate — compare to a parsed period assumption via invoice id order
      if (q && !(inv.id.toLowerCase().includes(q) || vaById(inv.vaId).name.toLowerCase().includes(q))) return false;
      return true;
    });
  }

  function renderList() {
    $('invBody').innerHTML = filtered().map(inv => {
      const va = vaById(inv.vaId);
      const pill = STATUS_PILL[inv.status] || 'closed';
      return `<tr>
        <td><strong style="color:var(--dark);">${inv.id}</strong>${inv.note ? `<div style="font-size:0.72rem; color:#B45309;"><i class="fas fa-exclamation-triangle"></i> ${esc(inv.note)}</div>` : ''}</td>
        <td>${esc(va.name)}</td>
        <td>${esc(inv.period)}</td>
        <td style="text-align:right;">${inv.hours}</td>
        <td style="text-align:right;">$${inv.rate}</td>
        <td style="text-align:right; font-weight:700;">${money(inv.hours * inv.rate)}</td>
        <td><span class="status-pill ${pill}">${inv.status}</span></td>
        <td style="text-align:right; white-space:nowrap;">${inv.status === 'due' ? `<button class="btn btn-primary btn-xs" data-inv="${inv.id}" data-act="pay">Pay</button> <button class="btn btn-ghost btn-xs" data-inv="${inv.id}" data-act="dispute">Dispute</button>` : `<button class="btn btn-ghost btn-xs" data-inv="${inv.id}" data-act="view"><i class="fas fa-eye"></i></button>`}</td>
      </tr>`;
    }).join('') || '<tr><td colspan="8" style="text-align:center; color:var(--text-light); padding:1.5rem;">No invoices match these filters.</td></tr>';
  }

  function renderAll() { renderStats(); renderControls(); renderList(); }

  $('searchInv').addEventListener('input', e => { search = e.target.value; renderList(); });
  $('vaSel').addEventListener('change', e => { vaF = e.target.value; renderControls(); renderList(); });
  $('periodSel').addEventListener('change', e => { period = e.target.value; renderList(); });
  $('statusTabs').addEventListener('click', e => {
    const btn = e.target.closest('[data-s]');
    if (btn) { statusF = btn.dataset.s; renderControls(); renderList(); }
  });

  $('invBody').addEventListener('click', e => {
    const btn = e.target.closest('[data-inv]');
    if (!btn) return;
    const inv = client.invoices.find(i => i.id === btn.dataset.inv);
    if (!inv) return;
    if (btn.dataset.act === 'pay') { inv.status = 'paid'; showToast(`${inv.id} paid. ${vaById(inv.vaId).name} will receive it in GCash.`); }
    if (btn.dataset.act === 'dispute') { inv.status = 'disputed'; showToast(`${inv.id} disputed. Funds remain in escrow.`); }
    save(); renderAll();
  });

  $('exportCsv').addEventListener('click', () => {
    const rows = [['Invoice', 'VA', 'Period', 'Hours', 'Rate', 'Amount', 'Status', 'Note']];
    filtered().forEach(inv => {
      const va = vaById(inv.vaId);
      rows.push([inv.id, va.name, inv.period, inv.hours, inv.rate, (inv.hours * inv.rate).toFixed(2), inv.status, inv.note || '']);
    });
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `invoices-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    showToast(`Exported ${rows.length - 1} invoices`);
  });

  renderAll();
</script>
</body>
</html>
