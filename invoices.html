<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoices — Jobseekers.ph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dash-body">

<div class="dash-wrapper">
  <aside class="dash-sidebar" id="dashSidebar" data-role="client" data-active="invoices"></aside>
  <div class="dash-overlay" id="dashOverlay"></div>

  <div class="dash-main">
    <header class="dash-topbar" id="dashTopbar"></header>
<script src="js/va-data.js"></script>
<script src="js/app-data.js"></script>
<script src="js/dash.js"></script>

    <main class="dash-content">
<div class="dash-page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap;">
  <div>
    <h1>Invoices</h1>
    <p>History of every invoice. Approve, dispute, download CSV for your bookkeeper.</p>
  </div>
  <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
    <button class="btn btn-outline-primary" id="exportCsv"><i class="fas fa-file-csv"></i> Export CSV</button>
    <a href="billing" class="btn btn-ghost"><i class="fas fa-credit-card"></i> Billing settings</a>
  </div>
</div>

<div class="stat-card-grid" id="invStats"></div>

<div class="dash-card" style="margin:1.25rem 0; padding:1rem;">
  <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
    <input type="text" id="searchInv" class="form-control" placeholder="Search invoice # or VA…" style="max-width:280px;" />
    <select id="vaSel" class="form-control" style="max-width:220px;"></select>
    <select id="periodSel" class="filter-sel" style="margin-left:auto;">
      <option value="all">All time</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
    </select>
  </div>
</div>

<div class="seg-tabs" id="statusTabs"></div>
<div class="dash-card" style="margin-top:0.75rem;"><div class="table-responsive"><table class="dash-table" style="width:100%;"><thead><tr><th>Invoice</th><th>VA</th><th>Period</th><th style="text-align:right;">Hours</th><th style="text-align:right;">Rate</th><th style="text-align:right;">Amount</th><th>Status</th><th></th></tr></thead><tbody id="invBody"></tbody></table></div></div>
    </main>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let statusF = 'all';
  let vaF = 'all';
  let search = '';
  let invoices = [];
  const money = n => '$' + Number(n || 0).toFixed(2);
  const vaName = i => ((i.vaFirstName || '') + ' ' + (i.vaLastName || '')).trim() || 'VA';

  const STATUSES = ['all', 'sent', 'paid', 'void', 'draft'];
  const STATUS_LABEL = { all: 'All', sent: 'Due', paid: 'Paid', void: 'Void', draft: 'Draft' };
  const STATUS_PILL  = { sent: 'pending', paid: 'hired', void: 'rejected', draft: 'closed' };

  async function load() {
    try {
      const r = await fetch('/api/invoices', { cache: 'no-store' });
      if (r.status === 401) { location.href = 'auth'; return; }
      const data = await r.json();
      invoices = data.invoices || [];
    } catch (e) { invoices = []; }
    renderAll();
  }

  function renderStats() {
    const due = invoices.filter(i => i.status === 'sent');
    const paid = invoices.filter(i => i.status === 'paid');
    const dueAmt = due.reduce((s, i) => s + Number(i.total || 0), 0);
    const paidAmt = paid.reduce((s, i) => s + Number(i.total || 0), 0);
    const stat = (label, num, icon, color, sub) => `
      <div class="stat-card">
        <div class="stat-card-top"><span class="stat-card-label">${label}</span><div class="stat-card-icon" style="background:${color}1a; color:${color};"><i class="fas ${icon}"></i></div></div>
        <div class="stat-card-num">${num}</div>
        <div class="stat-card-change" style="color:var(--text-light);">${sub}</div>
      </div>`;
    $('invStats').innerHTML =
      stat('Due', money(dueAmt), 'fa-hourglass-half', '#F59E0B', `${due.length} invoice${due.length === 1 ? '' : 's'}`) +
      stat('Paid lifetime', money(paidAmt), 'fa-check-circle', '#10B981', `${paid.length} invoices`) +
      stat('Draft', invoices.filter(i => i.status === 'draft').length, 'fa-file-alt', '#64748B', '') +
      stat('All invoices', invoices.length, 'fa-file-invoice-dollar', '#4F46E5', 'in history');
  }

  function renderControls() {
    const seen = new Map();
    for (const i of invoices) if (i.vaId) seen.set(i.vaId, vaName(i));
    $('vaSel').innerHTML = '<option value="all">All VAs</option>' + [...seen.entries()].map(([id, name]) => `<option value="${id}">${esc(name)}</option>`).join('');
    $('vaSel').value = vaF;
    $('statusTabs').innerHTML = STATUSES.map(s => `<button type="button" data-s="${s}" class="${s === statusF ? 'active' : ''}">${STATUS_LABEL[s]}<span>${s === 'all' ? invoices.length : invoices.filter(i => i.status === s).length}</span></button>`).join('');
  }

  function filtered() {
    const q = search.trim().toLowerCase();
    return invoices.filter(inv => {
      if (statusF !== 'all' && inv.status !== statusF) return false;
      if (vaF !== 'all' && inv.vaId !== vaF) return false;
      if (q && !((inv.invoiceNo || '').toLowerCase().includes(q) || vaName(inv).toLowerCase().includes(q))) return false;
      return true;
    });
  }

  function renderList() {
    $('invBody').innerHTML = filtered().map(inv => {
      const pill = STATUS_PILL[inv.status] || 'closed';
      const lineCount = Array.isArray(inv.items) ? inv.items.length : 0;
      return `<tr>
        <td><strong style="color:var(--dark);">${esc(inv.invoiceNo)}</strong><div style="font-size:0.72rem; color:var(--text-light);">${esc(inv.issuedOn)}</div></td>
        <td>${esc(vaName(inv))}</td>
        <td style="font-size:0.85rem; color:var(--text-light);">${lineCount} item${lineCount === 1 ? '' : 's'}</td>
        <td style="text-align:right;">—</td>
        <td style="text-align:right;">—</td>
        <td style="text-align:right; font-weight:700;">${money(inv.total)}</td>
        <td><span class="status-pill ${pill}">${inv.status === 'sent' ? 'due' : inv.status}</span></td>
        <td style="text-align:right; white-space:nowrap;">${inv.status === 'sent' ? `<button class="btn btn-primary btn-xs" data-inv="${inv.id}" data-act="pay">Mark paid</button> <button class="btn btn-ghost btn-xs" data-inv="${inv.id}" data-act="void">Void</button>` : ''}</td>
      </tr>`;
    }).join('') || '<tr><td colspan="8" style="text-align:center; color:var(--text-light); padding:1.5rem;">No invoices match these filters.</td></tr>';
  }

  function renderAll() { renderStats(); renderControls(); renderList(); }

  $('searchInv').addEventListener('input', e => { search = e.target.value; renderList(); });
  $('vaSel').addEventListener('change', e => { vaF = e.target.value; renderControls(); renderList(); });
  $('statusTabs').addEventListener('click', e => {
    const btn = e.target.closest('[data-s]');
    if (btn) { statusF = btn.dataset.s; renderControls(); renderList(); }
  });

  async function patchStatus(id, status) {
    const r = await fetch('/api/invoices/' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
    return r.ok;
  }

  $('invBody').addEventListener('click', async e => {
    const btn = e.target.closest('[data-inv]');
    if (!btn) return;
    const id = btn.dataset.inv;
    if (btn.dataset.act === 'pay')  { await patchStatus(id, 'paid'); showToast && showToast('Invoice marked paid.'); }
    if (btn.dataset.act === 'void') { await patchStatus(id, 'void'); showToast && showToast('Invoice voided.'); }
    await load();
  });

  $('exportCsv').addEventListener('click', () => {
    // Use the server CSV so the export matches the full database, not just this page.
    location.href = '/api/reports/export.csv';
  });

  load();
</script>
</body>
</html>
