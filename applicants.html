<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jobs &amp; Applicants — Jobseekers.ph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dash-body">

<div class="dash-wrapper">
  <aside class="dash-sidebar" id="dashSidebar" data-role="client" data-active="applicants"></aside>
  <div class="dash-overlay" id="dashOverlay"></div>

  <div class="dash-main">
    <header class="dash-topbar" id="dashTopbar"></header>
<script src="js/dash.js"></script>

    <main class="dash-content">
<div class="dash-page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap;">
  <div>
    <h1>Jobs &amp; Applicants</h1>
    <p>Review applicants, shortlist the best, and start a paid trial in one click.</p>
  </div>
  <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
    <a href="ai-match" class="btn btn-outline-primary"><i class="fas fa-magic"></i> AI Match</a>
    <a href="post-job" class="btn btn-primary"><i class="fas fa-plus"></i> Post a Job</a>
  </div>
</div>

<div class="dash-card" style="margin-bottom:1.25rem;">
  <div class="dash-card-body" style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
    <label class="form-label" for="jobSel" style="margin:0;">Job</label>
    <select id="jobSel" class="form-control" style="max-width:420px;"></select>
    <span id="jobInfo" style="font-size:0.8125rem; color:var(--text-light);"></span>
    <button class="btn btn-outline-primary btn-sm" id="compareBtn" style="margin-left:auto;"><i class="fas fa-balance-scale"></i> Compare shortlist</button>
    <select id="sortSel" class="filter-sel">
      <option value="match">Sort: Best match</option>
      <option value="rate">Sort: Lowest rate</option>
      <option value="date">Sort: Newest</option>
    </select>
  </div>
</div>

<div id="compareView" hidden></div>
<div class="seg-tabs" id="statusTabs"></div>
<div id="applicantList"></div>
    </main>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
  const fmtDay = t => new Date(Number(t)).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const $ = id => document.getElementById(id);

  const STATUS = {
    submitted: { label: 'New',         pill: 'new' },
    viewed:    { label: 'Viewed',      pill: 'viewed' },
    interview: { label: 'Interview',   pill: 'active' },
    trial:     { label: 'Trial offer', pill: 'trial' },
    trialing:  { label: 'Trialing',    pill: 'active' },
    hired:     { label: 'Hired',       pill: 'hired' },
    rejected:  { label: 'Declined',    pill: 'rejected' },
    withdrawn: { label: 'Withdrawn',   pill: 'closed' },
  };
  const TABS = ['all', 'submitted', 'viewed', 'interview', 'hired', 'rejected'];
  const TAB_LABEL = { all: 'All', submitted: 'New', viewed: 'Viewed', interview: 'Interview', hired: 'Hired', rejected: 'Declined' };

  const _params = new URLSearchParams(location.search);
  let jobs = [];
  let jobId = _params.get('job') || null;
  let filter = 'all';
  let applicants = [];

  async function load() {
    try {
      const meRes = await fetch('/api/me');
      if (meRes.status !== 200) { location.href = 'auth?next=applicants'; return; }
      const me = (await meRes.json()).user;
      if (me.role !== 'client') {
        document.querySelector('.dash-content').innerHTML = '<div class="empty-state"><i class="fas fa-user-lock"></i>Jobs &amp; Applicants is for client accounts.</div>';
        return;
      }
      const jr = await fetch('/api/jobs/mine');
      const jd = await jr.json();
      jobs = jd.jobs || [];
      if (!jobs.length) {
        document.querySelector('.dash-content').innerHTML = '<div class="empty-state"><i class="fas fa-briefcase"></i>You haven\'t posted any jobs yet.<br><a href="post-job" class="btn btn-primary" style="margin-top:1rem;">Post your first job</a></div>';
        return;
      }
      if (!jobId || !jobs.some(j => j.id === jobId)) jobId = jobs[0].id;
      $('jobSel').innerHTML = jobs.map(j => `<option value="${j.id}"${j.id === jobId ? ' selected' : ''}>${esc(j.title)} (${j.applicantCount || 0})</option>`).join('');
      $('jobSel').addEventListener('change', () => { jobId = $('jobSel').value; filter = 'all'; loadApplicants(); });
      $('sortSel').addEventListener('change', render);
      $('statusTabs').addEventListener('click', e => {
        const b = e.target.closest('[data-s]');
        if (b) { filter = b.dataset.s; render(); }
      });
      $('applicantList').addEventListener('click', onAction);

      // Hide compare for now — needs more thought post-payments.
      const compareBtn = $('compareBtn');
      if (compareBtn) compareBtn.hidden = true;

      await loadApplicants();
    } catch (err) {
      console.error('[applicants]', err);
      document.querySelector('.dash-content').innerHTML = '<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i><div>Could not load applicants. Please refresh.</div></div>';
    }
  }

  async function loadApplicants() {
    try {
      const res = await fetch('/api/applications?jobId=' + encodeURIComponent(jobId));
      const data = await res.json();
      applicants = data.applications || [];
    } catch (err) {
      applicants = [];
    }
    render();
  }

  function render() {
    const job = jobs.find(j => j.id === jobId);
    if (!job) return;
    $('jobInfo').innerHTML = `<span class="status-pill ${job.status === 'open' ? 'active' : 'closed'}">${esc(job.status)}</span> Posted ${fmtDay(job.createdAt)} · ${applicants.filter(a => a.status !== 'withdrawn').length} applicant${applicants.length === 1 ? '' : 's'}`;
    $('statusTabs').innerHTML = TABS.map(s => {
      const count = s === 'all' ? applicants.filter(a => a.status !== 'withdrawn').length : applicants.filter(a => a.status === s).length;
      return `<button type="button" data-s="${s}" class="${s === filter ? 'active' : ''}">${TAB_LABEL[s]}<span>${count}</span></button>`;
    }).join('');

    const sort = $('sortSel').value;
    let shown = applicants.filter(a => {
      if (filter === 'all') return a.status !== 'withdrawn';
      return a.status === filter;
    });
    shown.sort((a, b) =>
      sort === 'rate' ? a.rate - b.rate :
      sort === 'date' ? b.createdAt - a.createdAt :
      /* match placeholder → fall back to newest */ b.createdAt - a.createdAt
    );

    if (!shown.length) {
      $('applicantList').innerHTML = `<div class="empty-state"><i class="fas fa-user-friends"></i>No applicants in this list yet.</div>`;
      return;
    }

    const questions = job.screeningQuestions || [];
    $('applicantList').innerHTML = shown.map(a => {
      const st = STATUS[a.status] || { label: a.status, pill: 'pending' };
      const name = `${a.vaFirstName || ''} ${a.vaLastName || ''}`.trim() || 'VA';
      return `
        <div class="item-card${a.status === 'rejected' ? ' dim' : ''}">
          <div class="item-head">
            <div class="job-logo" style="background:rgba(79,70,229,0.08); width:48px; height:48px;"><i class="fas fa-user" style="color:var(--primary);"></i></div>
            <div class="grow">
              <h3>${esc(name)}</h3>
              <p>${esc(a.vaTitle || a.vaSkill || 'VA')}${a.vaCity ? ' · ' + esc(a.vaCity) : ''} · Applied ${fmtDay(a.createdAt)}</p>
            </div>
            <span class="status-pill ${st.pill}">${st.label}</span>
          </div>
          <div class="item-meta">
            <span>Proposed <strong>$${a.rate}/hr</strong></span>
            ${a.canStart ? `<span>Can start <strong>${esc(a.canStart)}</strong></span>` : ''}
            ${a.shiftOk ? '<span><i class="fas fa-check-circle" style="color:var(--success);"></i> Works your hours</span>' : ''}
            ${a.openToTrial ? '<span><i class="fas fa-flask" style="color:var(--success);"></i> Open to trial</span>' : ''}
          </div>
          <p class="item-quote">${esc(a.cover)}</p>
          ${questions.length ? `<details style="margin-top:0.75rem; font-size:0.85rem;">
            <summary style="cursor:pointer; color:var(--primary); font-weight:600;">Screening answers</summary>
            ${questions.map((q, qi) => `<p style="margin-top:0.5rem;"><strong style="color:var(--dark);">${esc(q)}</strong><br><span style="color:var(--text-light);">${esc((a.answers && a.answers[qi]) || '—')}</span></p>`).join('')}
          </details>` : ''}
          <div class="item-actions">
            ${a.status === 'submitted' ? `<button class="btn btn-outline-primary btn-sm" data-act="viewed" data-id="${a.id}"><i class="fas fa-eye"></i> Mark viewed</button>` : ''}
            ${['submitted', 'viewed'].includes(a.status) ? `<button class="btn btn-primary btn-sm" data-act="interview" data-id="${a.id}"><i class="fas fa-video"></i> Move to interview</button>` : ''}
            ${['submitted', 'viewed', 'interview'].includes(a.status) ? `<button class="btn btn-outline-primary btn-sm" data-act="hired" data-id="${a.id}"><i class="fas fa-handshake"></i> Mark hired</button>` : ''}
            <button class="btn btn-ghost btn-sm" data-act="message" data-va="${a.vaId}"><i class="fas fa-comment"></i> Message</button>
            ${['submitted', 'viewed', 'interview'].includes(a.status) ? `<button class="btn btn-ghost btn-sm" data-act="rejected" data-id="${a.id}" style="color:var(--danger);"><i class="fas fa-times"></i> Decline</button>` : ''}
            ${a.status === 'rejected' ? `<button class="btn btn-ghost btn-sm" data-act="submitted" data-id="${a.id}"><i class="fas fa-undo"></i> Undo</button>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  async function onAction(e) {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'message') {
      // Open (or reuse) a thread with this VA for the current job, then jump to messages.
      btn.disabled = true;
      try {
        const res = await fetch('/api/threads', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ otherId: btn.dataset.va, jobId }),
        });
        const data = await res.json();
        if (data.ok) location.href = 'messages?thread=' + encodeURIComponent(data.id);
        else { showToast(data.error || 'Could not open thread.'); btn.disabled = false; }
      } catch (err) { showToast('Network error.'); btn.disabled = false; }
      return;
    }
    // Any other action is an applications PATCH.
    const id = btn.dataset.id;
    btn.disabled = true;
    try {
      const res = await fetch('/api/applications/' + encodeURIComponent(id), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: act }),
      });
      const data = await res.json();
      if (!data.ok) { showToast(data.error || 'Update failed.'); btn.disabled = false; return; }
      const app = applicants.find(a => a.id === id);
      if (app) app.status = act;
      render();
    } catch (err) {
      showToast('Network error.');
      btn.disabled = false;
    }
  }

  load();
</script>
</body>
</html>
