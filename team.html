<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team — Jobseekers.ph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dash-body">

<div class="dash-wrapper">
  <aside class="dash-sidebar" id="dashSidebar" data-role="client" data-active="team"></aside>
  <div class="dash-overlay" id="dashOverlay"></div>

  <div class="dash-main">
    <header class="dash-topbar" id="dashTopbar"></header>
<script src="js/va-data.js"></script>
<script src="js/app-data.js"></script>
<script src="js/dash.js"></script>

    <main class="dash-content">
<div class="dash-page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap;">
  <div>
    <h1>Team</h1>
    <p>Everyone on contract, how they're pacing, and your private notes.</p>
  </div>
  <a href="applicants" class="btn btn-primary"><i class="fas fa-user-plus"></i> Hire more</a>
</div>

<div class="stat-card-grid" id="teamStats"></div>

<div class="how-tabs-wrap" style="justify-content:flex-start; margin:1.5rem 0 1rem;">
  <div class="how-tabs" style="background:#fff; flex-wrap:wrap;">
    <button class="how-tab active" data-tab="active"><i class="fas fa-user-check"></i> Active</button>
    <button class="how-tab" data-tab="trials"><i class="fas fa-flask"></i> On trial</button>
    <button class="how-tab" data-tab="past"><i class="fas fa-history"></i> Past</button>
  </div>
</div>

<div id="activeView"></div>
<div id="trialsView" hidden></div>
<div id="pastView" hidden></div>

<div id="noteModal" class="inline-panel" hidden style="position:fixed; inset:0; margin:auto; max-width:560px; max-height:88vh; overflow:auto; height:fit-content; z-index:100; background:#fff; box-shadow:0 20px 60px rgba(0,0,0,0.2);">
  <strong style="color:var(--dark);"><i class="fas fa-sticky-note" style="color:var(--primary);"></i> Notes · <span id="noteVa"></span></strong>
  <p style="font-size:0.78rem; color:var(--text-light); margin:0.25rem 0 0.75rem;"><i class="fas fa-lock"></i> Only your team can see these.</p>
  <div id="noteList" style="margin-bottom:0.75rem;"></div>
  <div class="form-row-2">
    <div class="form-group" style="margin-bottom:0.5rem;"><label class="form-label">Kind</label><select id="noteKind" class="form-control"><option value="general">General</option><option value="30-day">30-day review</option><option value="60-day">60-day review</option><option value="90-day">90-day review</option><option value="praise">Praise</option><option value="concern">Concern</option></select></div>
    <div class="form-group" style="margin-bottom:0.5rem;"><label class="form-label">Date</label><input id="noteDate" type="date" class="form-control" /></div>
  </div>
  <div class="form-group" style="margin-bottom:0.75rem;"><label class="form-label">Note</label><textarea id="noteText" class="form-control form-textarea" style="min-height:90px;"></textarea></div>
  <div style="display:flex; gap:0.5rem;"><button class="btn btn-primary btn-sm" id="noteSave"><i class="fas fa-check"></i> Add note</button><button class="btn btn-ghost btn-sm" id="noteClose">Close</button></div>
</div>
<div id="noteBackdrop" hidden style="position:fixed; inset:0; background:rgba(15,23,42,0.4); z-index:99;"></div>
    </main>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const fmtDay = t => new Date(t).toLocaleDateString();
  const money = n => '$' + Number(n || 0).toFixed(2);
  const DAY_MS_LOCAL = 86400000;
  const GUARANTEE_DAYS = 30;
  let noteTarget = null;        // vaId when the notes modal is open
  let notesSettings = {};        // { vaId: [ {t, kind, text} ] }
  let hiredApps = [];
  let endedApps = [];
  let trials = [];

  const noteKindColor = { 'general': '#4F46E5', '30-day': '#10B981', '60-day': '#10B981', '90-day': '#10B981', 'praise': '#F59E0B', 'concern': '#EF4444' };

  async function load() {
    try {
      const [jR, sR, trR] = await Promise.all([
        fetch('/api/jobs/mine', { cache: 'no-store' }),
        fetch('/api/settings', { cache: 'no-store' }),
        fetch('/api/trials',   { cache: 'no-store' }),
      ]);
      if (jR.status === 401) { location.href = 'auth'; return; }
      // Aggregate applications across every job owned by the client
      const jobs = jR.ok ? (await jR.json()).jobs || [] : [];
      hiredApps = [];
      endedApps = [];
      for (const j of jobs) {
        const ar = await fetch('/api/applications?jobId=' + encodeURIComponent(j.id), { cache: 'no-store' });
        if (!ar.ok) continue;
        const apps = (await ar.json()).applications || [];
        apps.forEach(a => {
          a.jobTitle = j.title;
          a.jobId = j.id;
          if (a.status === 'hired')   hiredApps.push(a);
          if (a.status === 'rejected' || a.status === 'withdrawn') endedApps.push(a);
        });
      }
      if (sR.ok) {
        const data = await sR.json();
        try { notesSettings = data.settings && data.settings.team_notes ? JSON.parse(data.settings.team_notes) : {}; } catch (e) { notesSettings = {}; }
      }
      if (trR.ok) trials = (await trR.json()).trials || [];
    } catch (e) {}
    renderAll();
  }

  async function saveNotes() {
    await fetch('/api/settings', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ team_notes: JSON.stringify(notesSettings) }),
    });
  }

  function daysOn(t) { return Math.floor((Date.now() - t) / DAY_MS_LOCAL); }

  function renderStats() {
    const totalRate = hiredApps.reduce((s, a) => s + Number(a.rate || 0), 0);
    const live = trials.filter(t => !t.outcome).length;
    const stat = (label, num, icon, color, sub) => `
      <div class="stat-card">
        <div class="stat-card-top"><span class="stat-card-label">${label}</span><div class="stat-card-icon" style="background:${color}1a; color:${color};"><i class="fas ${icon}"></i></div></div>
        <div class="stat-card-num">${num}</div>
        <div class="stat-card-change" style="color:var(--text-light);">${sub}</div>
      </div>`;
    $('teamStats').innerHTML =
      stat('Active hires', hiredApps.length, 'fa-user-check', '#4F46E5', 'on contract') +
      stat('On trial', live, 'fa-flask', '#10B981', 'running now') +
      stat('Avg rate', hiredApps.length ? money(totalRate / hiredApps.length) + '/hr' : '—', 'fa-dollar-sign', '#EC4899', '') +
      stat('Past hires', endedApps.length, 'fa-history', '#F59E0B', 'ended contracts');
  }

  function fullName(a) { return ((a.vaFirstName || '') + ' ' + (a.vaLastName || '')).trim() || 'VA'; }

  function hireCard(a) {
    const days = daysOn(a.updatedAt || a.createdAt);
    const left = GUARANTEE_DAYS - days;
    const notes = notesSettings[a.vaId] || [];
    return `
      <div class="item-card">
        <div class="item-head">
          <img src="/api/avatar/${encodeURIComponent(a.vaId)}" alt="" onerror="this.src='https://ui-avatars.com/api/?size=100&background=E2E8F0&color=4F46E5&name=${encodeURIComponent(fullName(a))}'" />
          <div class="grow">
            <h3>${esc(fullName(a))}</h3>
            <p>${esc(a.jobTitle || '—')} · $${Number(a.rate || 0).toFixed(2)}/hr · Day ${days} · Hired ${fmtDay(a.updatedAt || a.createdAt)}</p>
            ${notes.length ? `<p style="font-size:0.8125rem; color:var(--text-light); margin-top:0.25rem;"><i class="fas fa-sticky-note"></i> ${notes.length} note${notes.length === 1 ? '' : 's'} · last: <strong style="color:var(--dark);">${esc((notes[0].text || '').slice(0, 60))}${notes[0].text && notes[0].text.length > 60 ? '…' : ''}</strong></p>` : ''}
          </div>
          ${left > 0 ? `<span class="days-left">🛡️ ${left}d guarantee</span>` : '<span class="days-left out">Past guarantee</span>'}
        </div>
        <div class="item-actions">
          <button class="btn btn-outline-primary btn-sm" data-act="notes" data-id="${a.vaId}"><i class="fas fa-sticky-note"></i> Notes (${notes.length})</button>
          <a href="timesheets" class="btn btn-ghost btn-sm"><i class="fas fa-clock"></i> Timesheets</a>
          <a href="messages?as=client&to=${encodeURIComponent(a.vaId)}" class="btn btn-ghost btn-sm"><i class="fas fa-comment"></i> Message</a>
          <a href="calendar?va=${encodeURIComponent(a.vaId)}&schedule=1" class="btn btn-ghost btn-sm"><i class="fas fa-calendar-plus"></i> Schedule 1:1</a>
          <button class="btn btn-ghost btn-sm" data-act="offboard" data-id="${a.id}" style="color:var(--danger);"><i class="fas fa-door-open"></i> End contract</button>
        </div>
      </div>`;
  }

  function trialCard(t) {
    return `
      <div class="item-card">
        <div class="item-head">
          <img src="/api/avatar/${encodeURIComponent(t.vaId)}" alt="" onerror="this.src='https://ui-avatars.com/api/?size=100&background=E2E8F0&color=4F46E5&name=${encodeURIComponent(t.vaFirstName || 'VA')}'" />
          <div class="grow"><h3>${esc((t.vaFirstName || '') + ' ' + (t.vaLastName || ''))}</h3><p>${esc(t.jobTitle || '—')} · ends ${fmtDay(t.endsAt)}</p></div>
          <span class="status-pill ${t.outcome ? 'closed' : 'pending'}">${t.outcome || 'in progress'}</span>
        </div>
        ${t.scope ? `<p class="item-quote">${esc(t.scope)}</p>` : ''}
        <div class="item-actions">
          <button class="btn btn-primary btn-sm" data-trial="${t.id}" data-outcome="hired"><i class="fas fa-check"></i> Convert to hire</button>
          <button class="btn btn-ghost btn-sm" data-trial="${t.id}" data-outcome="passed">Pass</button>
          <a href="messages?as=client&to=${encodeURIComponent(t.vaId)}" class="btn btn-ghost btn-sm"><i class="fas fa-comment"></i> Message</a>
        </div>
      </div>`;
  }

  function renderActive() {
    $('activeView').innerHTML = hiredApps.map(hireCard).join('')
      || '<div class="empty-state"><i class="fas fa-user-check"></i>No active hires yet. <a href="applicants" style="color:var(--primary); font-weight:600;">Review applicants</a></div>';
  }
  function renderTrials() {
    const live = trials.filter(t => !t.outcome);
    $('trialsView').innerHTML = live.map(trialCard).join('') || '<div class="empty-state"><i class="fas fa-flask"></i>No trials in progress.</div>';
  }
  function renderPast() {
    $('pastView').innerHTML = endedApps.length ? endedApps.map(a => `
      <div class="item-card dim">
        <div class="item-head">
          <img src="/api/avatar/${encodeURIComponent(a.vaId)}" alt="" onerror="this.src='https://ui-avatars.com/api/?size=100&background=E2E8F0&color=4F46E5&name=${encodeURIComponent(fullName(a))}'" />
          <div class="grow"><h3>${esc(fullName(a))}</h3><p>${esc(a.jobTitle || '—')} · $${Number(a.rate || 0).toFixed(2)}/hr · ${fmtDay(a.updatedAt || a.createdAt)}</p></div>
          <span class="status-pill closed">${esc(a.status)}</span>
        </div>
      </div>`).join('') : '<div class="empty-state"><i class="fas fa-history"></i>No past hires.</div>';
  }

  function renderAll() { renderStats(); renderActive(); renderTrials(); renderPast(); }

  function renderNotes() {
    const list = notesSettings[noteTarget] || [];
    $('noteList').innerHTML = list.length ? list.map((n, i) => `
      <div style="padding:0.6rem; border-left:3px solid ${noteKindColor[n.kind] || '#4F46E5'}; background:#F8FAFC; margin-bottom:0.5rem; border-radius:0.3rem;">
        <div style="display:flex; justify-content:space-between; font-size:0.72rem; color:var(--text-light); margin-bottom:0.25rem;"><strong style="color:var(--dark); text-transform:uppercase; letter-spacing:0.05em;">${esc(n.kind)}</strong><span>${fmtDay(n.t)} · <button class="btn btn-ghost btn-xs" style="padding:0; color:var(--danger);" data-noteact="del" data-i="${i}">delete</button></span></div>
        <div style="font-size:0.875rem; color:var(--dark);">${esc(n.text)}</div>
      </div>`).join('') : '<p style="font-size:0.8125rem; color:var(--text-light);">No notes yet. Add your first below.</p>';
  }

  function openNotes(vaId) {
    noteTarget = vaId;
    const a = hiredApps.find(x => x.vaId === vaId);
    $('noteVa').textContent = a ? fullName(a) : vaId;
    $('noteDate').value = new Date().toISOString().slice(0, 10);
    $('noteKind').value = 'general';
    $('noteText').value = '';
    renderNotes();
    $('noteModal').hidden = false; $('noteBackdrop').hidden = false;
  }
  const closeNotes = () => { $('noteModal').hidden = true; $('noteBackdrop').hidden = true; noteTarget = null; };

  document.querySelectorAll('.how-tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.how-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    const tab = t.dataset.tab;
    $('activeView').hidden = tab !== 'active';
    $('trialsView').hidden = tab !== 'trials';
    $('pastView').hidden = tab !== 'past';
  }));

  $('activeView').addEventListener('click', async e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    if (btn.dataset.act === 'notes') { openNotes(btn.dataset.id); return; }
    if (btn.dataset.act === 'offboard') {
      if (btn.dataset.confirm !== '1') { btn.dataset.confirm = '1'; btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Click again to end'; return; }
      await fetch('/api/applications/' + encodeURIComponent(btn.dataset.id), {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'rejected' }),
      });
      await load();
      showToast && showToast('Contract ended.');
    }
  });

  $('trialsView').addEventListener('click', async e => {
    const btn = e.target.closest('[data-trial]');
    if (!btn) return;
    await fetch('/api/trials/' + encodeURIComponent(btn.dataset.trial), {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ outcome: btn.dataset.outcome }),
    });
    await load();
  });

  $('noteSave').addEventListener('click', async () => {
    const text = $('noteText').value.trim();
    if (!text || !noteTarget) return;
    (notesSettings[noteTarget] ||= []).unshift({ t: new Date($('noteDate').value || Date.now()).getTime(), kind: $('noteKind').value, text });
    await saveNotes();
    renderNotes(); renderActive();
    $('noteText').value = '';
    showToast && showToast('Note added');
  });
  $('noteClose').addEventListener('click', closeNotes);
  $('noteBackdrop').addEventListener('click', closeNotes);
  $('noteList').addEventListener('click', async e => {
    const btn = e.target.closest('[data-noteact]');
    if (!btn || !noteTarget) return;
    if (btn.dataset.noteact === 'del') {
      notesSettings[noteTarget].splice(Number(btn.dataset.i), 1);
      await saveNotes();
      renderNotes(); renderActive();
    }
  });

  load();
</script>
</body>
</html>
