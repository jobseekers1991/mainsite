<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Trust &amp; Safety — Jobseekers.ph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dash-body">

<div class="dash-wrapper">
  <aside class="dash-sidebar" id="dashSidebar" data-role="admin" data-active="overview"></aside>
  <div class="dash-overlay" id="dashOverlay"></div>

  <div class="dash-main">
    <header class="dash-topbar" id="dashTopbar"></header>
<script src="js/va-data.js"></script>
<script src="js/app-data.js"></script>
<script src="js/dash.js"></script>

    <main class="dash-content">
<div class="dash-page-header">
  <h1>Trust &amp; Safety</h1>
  <p>Review flagged job posts, verify users and badges, and resolve payment disputes.</p>
</div>

<div class="stat-card-grid" id="adminStats"></div>

<div class="how-tabs-wrap" style="justify-content:flex-start; margin:1.75rem 0 1.25rem;">
  <div class="how-tabs" style="background:#fff; flex-wrap:wrap;">
    <button class="how-tab active" data-target="flagged"><i class="fas fa-flag"></i> Flagged Posts</button>
    <button class="how-tab" data-target="verify"><i class="fas fa-id-card"></i> Verifications</button>
    <button class="how-tab" data-target="disputes"><i class="fas fa-balance-scale"></i> Disputes</button>
    <button class="how-tab" data-target="log"><i class="fas fa-history"></i> Activity Log</button>
  </div>
</div>

<div id="flagged" class="tab-panel active"><div id="flaggedList"></div></div>
<div id="verify" class="tab-panel"><div class="seg-tabs" id="verifyTabs"></div><div id="verifyList"></div></div>
<div id="disputes" class="tab-panel"><div id="disputeList"></div></div>
<div id="log" class="tab-panel"><div class="dash-card"><div class="table-responsive"><table class="dash-table" style="width:100%;"><thead><tr><th>When</th><th>Action</th><th>Item</th><th>Note</th></tr></thead><tbody id="logBody"></tbody></table></div></div></div>
    </main>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const fmtDay = t => new Date(t).toLocaleDateString();
  let stats = {};
  let flagged = [];
  let contacts = [];

  async function guard() {
    // Only let admin accounts render this page. Others get sent home.
    try {
      const r = await fetch('/api/me', { cache: 'no-store' });
      if (r.status !== 200) { location.href = 'auth'; return false; }
      const { user } = await r.json();
      if (!user || user.role !== 'admin') {
        document.querySelector('.dash-content').innerHTML =
          '<div class="dash-card" style="padding:2rem; text-align:center;"><h2>Admin only</h2><p>You need an admin account to see Trust &amp; Safety tools.</p></div>';
        return false;
      }
      return true;
    } catch (e) { return false; }
  }

  async function load() {
    if (!(await guard())) return;
    try {
      const [sR, fR, cR] = await Promise.all([
        fetch('/api/admin/stats', { cache: 'no-store' }),
        fetch('/api/admin/flagged-jobs', { cache: 'no-store' }),
        fetch('/api/admin/contact-messages', { cache: 'no-store' }),
      ]);
      if (sR.ok) stats = await sR.json();
      if (fR.ok) flagged = (await fR.json()).jobs || [];
      if (cR.ok) contacts = (await cR.json()).messages || [];
    } catch (e) {}
    renderAll();
  }

  function openTabFromHash() {
    const tab = document.querySelector(`.how-tab[data-target="${location.hash.slice(1)}"]`);
    if (tab) tab.click();
  }
  window.addEventListener('hashchange', openTabFromHash);
  document.querySelectorAll('.how-tab').forEach(tab => tab.addEventListener('click', () => {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.how-tab').forEach(x => x.classList.remove('active'));
    tab.classList.add('active');
    const panel = document.getElementById(tab.dataset.target);
    if (panel) panel.classList.add('active');
  }));

  function renderStats() {
    const stat = (label, num, icon, color, sub) => `
      <div class="stat-card">
        <div class="stat-card-top"><span class="stat-card-label">${label}</span><div class="stat-card-icon" style="background:${color}1a; color:${color};"><i class="fas ${icon}"></i></div></div>
        <div class="stat-card-num">${num}</div>
        <div class="stat-card-change" style="color:var(--text-light);">${sub}</div>
      </div>`;
    const accs = stats.accounts || {};
    $('adminStats').innerHTML =
      stat('Flagged posts', stats.flaggedJobs || 0, 'fa-flag', '#EF4444', 'hidden until reviewed') +
      stat('Contact inbox', stats.contactMessages || 0, 'fa-envelope', '#4F46E5', 'all time') +
      stat('Total accounts', (accs.client || 0) + (accs.va || 0) + (accs.admin || 0), 'fa-users', '#10B981', `${accs.client || 0} clients · ${accs.va || 0} VAs`) +
      stat('Applications', stats.applications || 0, 'fa-file-alt', '#F59E0B', 'submitted');
  }

  function renderFlagged() {
    $('flaggedList').innerHTML = flagged.map(f => `
      <div class="item-card">
        <div class="item-head">
          <div class="job-logo" style="background:rgba(239,68,68,0.08); width:48px; height:48px; font-size:1.25rem;">⚠️</div>
          <div class="grow">
            <h3>${esc(f.title)}</h3>
            <p>${esc(f.companyName || '—')} · ${esc(f.clientEmail || '')} · flagged ${fmtDay(f.createdAt)}</p>
          </div>
          <span class="status-pill pending">Needs review</span>
        </div>
        <p class="item-quote">${esc((f.description || '').slice(0, 400))}${(f.description || '').length > 400 ? '…' : ''}</p>
        <div class="item-actions">
          <button class="btn btn-ghost btn-sm" data-flag="${f.id}" data-act="approve"><i class="fas fa-check"></i> Publish</button>
          <button class="btn btn-primary btn-sm" data-flag="${f.id}" data-act="remove" style="background:var(--danger); box-shadow:none;"><i class="fas fa-ban"></i> Remove</button>
        </div>
      </div>`).join('') || '<div class="empty-state"><i class="fas fa-check-circle"></i>Queue is clear.</div>';
  }

  function renderVerify() {
    $('verifyList').innerHTML = '<div class="empty-state"><i class="fas fa-check-circle"></i>Identity &amp; business verifications are coming soon. Users can request verification from their Settings page and it will land here.</div>';
    $('verifyTabs').innerHTML = '';
  }

  function renderDisputes() {
    // Mounted on the "disputes" panel, we use it for the contact inbox too.
    $('disputeList').innerHTML = contacts.length ? contacts.map(c => `
      <div class="item-card">
        <div class="item-head">
          <div class="job-logo" style="background:rgba(79,70,229,0.08); width:48px; height:48px; font-size:1.25rem;"><i class="fas fa-envelope" style="color:var(--primary);"></i></div>
          <div class="grow">
            <h3>${esc(c.name)} — ${esc(c.subject || 'No subject')}</h3>
            <p>${esc(c.email)} · ${fmtDay(c.createdAt)}</p>
          </div>
        </div>
        <p class="item-quote">${esc(c.body)}</p>
        <div class="item-actions">
          <a href="mailto:${encodeURIComponent(c.email)}?subject=Re: ${encodeURIComponent(c.subject || 'Jobseekers.ph contact')}" class="btn btn-primary btn-sm"><i class="fas fa-reply"></i> Reply via email</a>
        </div>
      </div>`).join('') : '<div class="empty-state"><i class="fas fa-check-circle"></i>No contact-form submissions yet.</div>';
  }

  function renderLog() {
    $('logBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-light); padding:2rem;">Audit log is coming soon.</td></tr>';
  }

  function renderAll() { renderStats(); renderFlagged(); renderVerify(); renderDisputes(); renderLog(); }

  document.querySelector('.dash-content').addEventListener('click', async e => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset;
    if (d.flag) {
      const action = d.act === 'remove' ? 'remove' : 'approve';
      const r = await fetch(`/api/admin/jobs/${encodeURIComponent(d.flag)}/${action}`, { method: 'POST' });
      if (r.ok) {
        flagged = flagged.filter(x => x.id !== d.flag);
        showToast && showToast(action === 'remove' ? 'Post removed.' : 'Post published.');
        renderFlagged();
      }
    }
  });

  load().then(openTabFromHash);
</script>
</body>
</html>
