<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — Jobseekers.ph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dash-body">

<div class="dash-wrapper">
  <aside class="dash-sidebar" id="dashSidebar" data-role="client" data-active="notifications"></aside>
  <div class="dash-overlay" id="dashOverlay"></div>

  <div class="dash-main">
    <header class="dash-topbar" id="dashTopbar"></header>
<script src="js/va-data.js"></script>
<script src="js/app-data.js"></script>
<script src="js/dash.js"></script>

    <main class="dash-content">
<div class="dash-page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap;">
  <div>
    <h1>Notifications</h1>
    <p>Everything that needs your attention, in one feed.</p>
  </div>
  <div style="display:flex; gap:0.5rem;">
    <button class="btn btn-outline-primary" id="markAll"><i class="fas fa-check-double"></i> Mark all read</button>
    <button class="btn btn-ghost" id="clearAll" style="color:var(--danger);"><i class="fas fa-trash"></i> Clear all</button>
  </div>
</div>

<div class="seg-tabs" id="notifTabs" style="margin-top:1rem;"></div>
<div id="notifList"></div>

<style>
  .notif { display:flex; gap:0.75rem; padding:1rem; background:#fff; border:1px solid var(--border); border-radius:0.75rem; margin-bottom:0.5rem; cursor:pointer; transition:all 0.15s; }
  .notif.unread { background:rgba(79,70,229,0.03); border-left:3px solid var(--primary); }
  .notif:hover { border-color:var(--primary); }
  .notif-ico { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:1rem; }
  .notif-time { font-size:0.72rem; color:var(--text-light); white-space:nowrap; }
  .notif-close { background:none; border:none; color:var(--text-light); cursor:pointer; padding:0.25rem; }
</style>
    </main>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let filter = 'all';
  let notifications = [];

  const KINDS = {
    all:         { label: 'All',         icon: 'fa-bell',                 color: '#4F46E5' },
    unread:      { label: 'Unread',      icon: 'fa-circle',               color: '#EC4899' },
    application: { label: 'Applicants',  icon: 'fa-user-plus',            color: '#4F46E5' },
    interview:   { label: 'Interviews',  icon: 'fa-video',                color: '#10B981' },
    message:     { label: 'Messages',    icon: 'fa-comments',             color: '#06B6D4' },
    timesheet:   { label: 'Timesheets',  icon: 'fa-clock',                color: '#F59E0B' },
    invoice:     { label: 'Invoices',    icon: 'fa-file-invoice-dollar',  color: '#EC4899' },
    trial:       { label: 'Trials',      icon: 'fa-flask',                color: '#10B981' },
    review:      { label: 'Reviews',     icon: 'fa-star',                 color: '#F59E0B' },
    team:        { label: 'Team',        icon: 'fa-users',                color: '#4F46E5' },
    system:      { label: 'System',      icon: 'fa-cog',                  color: '#64748B' },
  };

  const DAY_MS_LOCAL = 86400000;
  const ago = t => {
    const d = Date.now() - t;
    if (d < 60000) return 'just now';
    if (d < 3600000) return Math.round(d / 60000) + 'm ago';
    if (d < DAY_MS_LOCAL) return Math.round(d / 3600000) + 'h ago';
    if (d < 7 * DAY_MS_LOCAL) return Math.round(d / DAY_MS_LOCAL) + 'd ago';
    return new Date(t).toLocaleDateString();
  };

  async function load() {
    try {
      const r = await fetch('/api/notifications', { cache: 'no-store' });
      if (r.status === 401) { location.href = 'auth'; return; }
      const data = await r.json();
      notifications = data.notifications || [];
    } catch (e) { notifications = []; }
    renderAll();
  }

  function filtered() {
    if (filter === 'all') return notifications;
    if (filter === 'unread') return notifications.filter(n => !n.readAt);
    return notifications.filter(n => n.kind === filter);
  }

  function renderTabs() {
    $('notifTabs').innerHTML = Object.entries(KINDS).map(([k, v]) => {
      const count = k === 'all' ? notifications.length
        : k === 'unread' ? notifications.filter(n => !n.readAt).length
        : notifications.filter(n => n.kind === k).length;
      return `<button type="button" data-f="${k}" class="${k === filter ? 'active' : ''}">${v.label}<span>${count}</span></button>`;
    }).join('');
  }

  function renderList() {
    const list = filtered();
    $('notifList').innerHTML = list.length ? list.map(n => {
      const kind = KINDS[n.kind] || KINDS.system;
      return `
        <a class="notif${n.readAt ? '' : ' unread'}" href="${esc(n.link || '#')}" data-id="${n.id}" style="text-decoration:none; color:inherit;">
          <div class="notif-ico" style="background:${kind.color}1a; color:${kind.color};"><i class="fas ${kind.icon}"></i></div>
          <div style="flex:1; min-width:0;">
            <div style="display:flex; justify-content:space-between; gap:0.5rem;"><strong style="color:var(--dark); font-size:0.9375rem;">${esc(n.title)}</strong><span class="notif-time">${ago(n.createdAt)}</span></div>
            <p style="font-size:0.8125rem; color:var(--text-light); margin:0.25rem 0 0;">${esc(n.body || '')}</p>
          </div>
          <button class="notif-close" data-act="delete" data-id="${n.id}" title="Dismiss"><i class="fas fa-times"></i></button>
        </a>`;
    }).join('') : '<div class="empty-state"><i class="fas fa-bell"></i>Nothing here. You\'re all caught up.</div>';
  }

  function renderAll() { renderTabs(); renderList(); }

  $('notifTabs').addEventListener('click', e => {
    const btn = e.target.closest('[data-f]');
    if (btn) { filter = btn.dataset.f; renderAll(); }
  });

  $('notifList').addEventListener('click', async e => {
    const close = e.target.closest('[data-act="delete"]');
    if (close) {
      e.preventDefault();
      const id = close.dataset.id;
      notifications = notifications.filter(n => n.id !== id);
      renderAll();
      try { await fetch('/api/notifications/' + encodeURIComponent(id), { method: 'DELETE' }); } catch (_) {}
      return;
    }
    const link = e.target.closest('a.notif');
    if (link) {
      const id = link.dataset.id;
      const n = notifications.find(x => x.id === id);
      if (n && !n.readAt) {
        n.readAt = Date.now();
        try { fetch('/api/notifications/' + encodeURIComponent(id) + '/read', { method: 'POST' }); } catch (_) {}
      }
    }
  });

  $('markAll').addEventListener('click', async () => {
    notifications.forEach(n => n.readAt = n.readAt || Date.now());
    renderAll();
    try { await fetch('/api/notifications/read-all', { method: 'POST' }); } catch (_) {}
    if (typeof showToast === 'function') showToast('All marked as read');
  });

  $('clearAll').addEventListener('click', async e => {
    if (e.target.dataset.confirm !== '1') { e.target.dataset.confirm = '1'; e.target.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Click again to clear'; return; }
    const ids = notifications.map(n => n.id);
    notifications = [];
    renderAll();
    await Promise.allSettled(ids.map(id => fetch('/api/notifications/' + encodeURIComponent(id), { method: 'DELETE' })));
    if (typeof showToast === 'function') showToast('Notifications cleared');
  });

  load();
</script>
</body>
</html>
