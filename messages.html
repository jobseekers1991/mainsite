<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — Jobseekers.ph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dash-body">

<div class="dash-wrapper">
  <aside class="dash-sidebar" id="dashSidebar" data-role="va" data-active="messages"></aside>
  <div class="dash-overlay" id="dashOverlay"></div>

  <div class="dash-main">
    <header class="dash-topbar" id="dashTopbar"></header>
<script src="js/dash.js"></script>

    <main class="dash-content">
<div class="dash-page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap;">
  <div>
    <h1>Messages</h1>
    <p>Keep conversations on Jobseekers.ph so your payments and agreements stay protected.</p>
  </div>
</div>

<div class="inbox" id="inbox">
  <div class="inbox-list">
    <div class="inbox-search">
      <div class="search-field" style="margin:0;"><i class="fas fa-search"></i><input type="text" id="threadSearch" placeholder="Search conversations" /></div>
    </div>
    <div id="threadList"></div>
  </div>

  <div class="chat" id="chat">
    <div class="chat-empty" id="chatEmpty"><i class="fas fa-comments"></i><p>Select a conversation</p></div>
    <div class="chat-head" id="chatHead" hidden></div>
    <div class="chat-body" id="chatBody" hidden></div>
    <div class="chat-compose" id="chatCompose" hidden>
      <div class="alert alert-warn" id="offPlatformWarn" hidden style="margin-bottom:0.625rem; font-size:0.8125rem;">
        <i class="fas fa-shield-alt" style="margin-top:0.15rem;"></i>
        <div><strong>Heads up:</strong> moving chats or payments off Jobseekers.ph (Telegram, WhatsApp, direct GCash…) removes payment protection, dispute help, and the Replacement Guarantee.</div>
      </div>
      <div class="chat-quick" id="quickReplies"></div>
      <form id="composeForm">
        <textarea id="composeText" class="form-control" rows="1" placeholder="Write a message…  (Enter to send, Shift+Enter for a new line)"></textarea>
        <button class="btn btn-primary" type="submit" aria-label="Send"><i class="fas fa-paper-plane"></i></button>
      </form>
    </div>
  </div>
</div>
    </main>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
  const OFF_PLATFORM_RE = /\b(telegram|whatsapp|viber|signal|wechat|gcash me|pay (you )?outside|outside (the )?(platform|jobseekers)|paypal me|send (me )?(your )?(otp|password|bank))\b/i;
  const DAY_MS = 86400000;
  const params = new URLSearchParams(location.search);
  const $ = id => document.getElementById(id);

  let me = null;
  let threads = [];
  let activeThread = null;
  let activeMessages = [];
  let lastMessageAt = 0;
  let pollTimer = null;
  let composing = false;

  const timeLabel = t => {
    const diff = Date.now() - t;
    if (diff < 60000) return 'now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm';
    if (diff < DAY_MS) return Math.floor(diff / 3600000) + 'h';
    return new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  };
  const clock = t => new Date(t).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

  async function init() {
    try {
      const meRes = await fetch('/api/me');
      if (meRes.status !== 200) { location.href = 'auth?next=messages'; return; }
      me = (await meRes.json()).user;
      // Keep the sidebar in the right role.
      const sb = document.getElementById('dashSidebar');
      if (sb && me && me.role) sb.dataset.role = me.role;
    } catch (err) { location.href = 'auth?next=messages'; return; }

    await loadThreads();

    $('threadList').addEventListener('click', e => {
      const btn = e.target.closest('.inbox-thread');
      if (btn) openThread(btn.dataset.id);
    });
    $('threadSearch').addEventListener('input', renderThreadList);
    $('composeText').addEventListener('input', checkCompose);
    $('composeText').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('composeForm').requestSubmit(); }
    });
    $('composeForm').addEventListener('submit', sendMessage);

    const threadParam = params.get('thread');
    const toParam     = params.get('to');
    if (threadParam && threads.find(t => t.id === threadParam)) {
      openThread(threadParam);
    } else if (toParam) {
      // Open (or create) a thread with that user and switch to it.
      try {
        const res = await fetch('/api/threads', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ otherId: toParam }),
        });
        const data = await res.json();
        if (data.ok) {
          await loadThreads();
          openThread(data.id);
        }
      } catch (err) { /* noop */ }
    } else if (window.innerWidth > 900 && threads.length) {
      openThread((threads.find(t => t.unreadCount > 0) || threads[0]).id);
    }

    // Soft poll for new threads / updated previews every 15s while the page is open.
    setInterval(loadThreads, 15000);
  }

  async function loadThreads() {
    try {
      const res = await fetch('/api/threads');
      const data = await res.json();
      if (data.ok) threads = data.threads || [];
    } catch (err) { /* keep stale list */ }
    renderThreadList();
    // Refresh the compose button badge on the dashboard nav if present.
    if (typeof renderDashNav === 'function') renderDashNav();
  }

  function renderThreadList() {
    const q = $('threadSearch').value.trim().toLowerCase();
    const list = threads.slice().filter(t => {
      if (!q) return true;
      const hay = ((t.otherFirstName || '') + ' ' + (t.otherLastName || '') + ' ' + (t.otherCompany || '') + ' ' + (t.jobTitle || '') + ' ' + (t.lastMessage ? t.lastMessage.body : '')).toLowerCase();
      return hay.includes(q);
    });

    if (!list.length) {
      $('threadList').innerHTML = '<p style="padding:1.5rem; text-align:center; color:var(--text-light); font-size:0.875rem;">No conversations yet</p>';
      return;
    }

    $('threadList').innerHTML = list.map(t => {
      const name = `${t.otherFirstName || ''} ${t.otherLastName || ''}`.trim() || 'User';
      const sub = t.jobTitle ? `About: ${t.jobTitle}` : (t.otherCompany || (t.otherRole === 'client' ? 'Client' : 'VA'));
      const last = t.lastMessage;
      const preview = last ? (last.mine ? 'You: ' : '') + last.body : 'Say hello 👋';
      return `
        <button type="button" class="inbox-thread${t.id === (activeThread && activeThread.id) ? ' active' : ''}${t.unreadCount > 0 ? ' unread' : ''}" data-id="${esc(t.id)}">
          <div class="chat-avatar" style="width:40px; height:40px; border-radius:50%; background:rgba(79,70,229,0.08); display:flex; align-items:center; justify-content:center; color:var(--primary); font-weight:700;">${esc((name[0] || '?').toUpperCase())}</div>
          <div class="meta">
            <div class="who"><span>${esc(name)}</span><time>${last ? timeLabel(last.createdAt) : ''}</time></div>
            <div class="sub">${esc(sub)}</div>
            <div class="preview">${esc(preview)}</div>
          </div>
          ${t.unreadCount > 0 ? `<span class="unread-dot" aria-label="${t.unreadCount} unread"></span>` : ''}
        </button>`;
    }).join('');
  }

  async function openThread(id) {
    const t = threads.find(x => x.id === id);
    if (!t) return;
    activeThread = t;
    activeMessages = [];
    lastMessageAt = 0;
    clearInterval(pollTimer);

    $('inbox').classList.add('chat-open');
    $('chatEmpty').hidden = true;
    $('chatHead').hidden = false;
    $('chatBody').hidden = false;
    $('chatCompose').hidden = false;

    const name = `${t.otherFirstName || ''} ${t.otherLastName || ''}`.trim() || 'User';
    const sub = t.jobTitle ? `About: ${t.jobTitle}` : (t.otherCompany || (t.otherRole === 'client' ? 'Client' : 'VA'));
    $('chatHead').innerHTML = `
      <button class="chat-back" id="chatBack" aria-label="Back"><i class="fas fa-arrow-left"></i></button>
      <div class="chat-avatar" style="width:44px; height:44px; border-radius:50%; background:rgba(79,70,229,0.08); display:flex; align-items:center; justify-content:center; color:var(--primary); font-weight:700; font-size:1.125rem;">${esc((name[0] || '?').toUpperCase())}</div>
      <div class="grow"><strong>${esc(name)}</strong><small>${esc(sub)}</small></div>
      <button class="btn btn-ghost btn-sm" id="reportUser" title="Report"><i class="fas fa-flag"></i></button>`;
    $('chatBack').addEventListener('click', () => { $('inbox').classList.remove('chat-open'); activeThread = null; clearInterval(pollTimer); renderThreadList(); });
    $('reportUser').addEventListener('click', () => showToast('Reported. Trust & Safety will review this conversation.'));

    $('quickReplies').innerHTML = '';
    $('composeText').value = '';
    checkCompose();
    await fetchMessages(true);
    pollTimer = setInterval(() => fetchMessages(false), 5000);
    renderThreadList();
    if (window.innerWidth > 900) $('composeText').focus();
  }

  async function fetchMessages(initial) {
    if (!activeThread) return;
    try {
      const url = `/api/threads/${encodeURIComponent(activeThread.id)}/messages${lastMessageAt ? '?after=' + lastMessageAt : ''}`;
      const res = await fetch(url);
      if (res.status !== 200) return;
      const data = await res.json();
      if (!data.ok) return;
      if (data.messages.length) {
        if (initial) activeMessages = data.messages;
        else activeMessages = activeMessages.concat(data.messages);
        lastMessageAt = Math.max(lastMessageAt, ...data.messages.map(m => m.createdAt));
      }
      renderMessages();
      if (!initial && data.messages.length) loadThreads();
    } catch (err) { /* ignore */ }
  }

  function renderMessages() {
    const body = $('chatBody');
    const anyOff = activeMessages.some(m => !m.mine && m.offPlatform);
    body.innerHTML =
      `<div class="chat-system"><i class="fas fa-lock"></i> Messages here are protected by Jobseekers.ph. Never pay a fee to get hired.</div>` +
      activeMessages.map(m => `<div class="bubble ${m.mine ? 'me' : 'them'}">${esc(m.body)}<time>${clock(m.createdAt)}</time></div>`).join('') +
      (anyOff ? `<div class="chat-system" style="color:#92400E;"><i class="fas fa-exclamation-triangle"></i> This conversation mentions going off-platform. Stay protected by keeping it here.</div>` : '');
    body.scrollTop = body.scrollHeight;
  }

  function checkCompose() {
    const ta = $('composeText');
    $('offPlatformWarn').hidden = !OFF_PLATFORM_RE.test(ta.value);
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
  }

  async function sendMessage(e) {
    e.preventDefault();
    if (composing || !activeThread) return;
    const text = $('composeText').value.trim();
    if (!text) return;
    composing = true;
    try {
      const res = await fetch(`/api/threads/${encodeURIComponent(activeThread.id)}/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ body: text }),
      });
      const data = await res.json();
      if (!data.ok) { showToast(data.error || 'Could not send.'); composing = false; return; }
      activeMessages.push(data.message);
      lastMessageAt = Math.max(lastMessageAt, data.message.createdAt);
      $('composeText').value = '';
      checkCompose();
      renderMessages();
      loadThreads();
    } catch (err) { showToast('Network error.'); }
    composing = false;
  }

  init();
</script>
</body>
</html>
