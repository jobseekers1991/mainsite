<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Job Posts — Jobseekers.ph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dash-body">

<div class="dash-wrapper">
  <aside class="dash-sidebar" id="dashSidebar" data-role="client" data-active="myjobs"></aside>
  <div class="dash-overlay" id="dashOverlay"></div>

  <div class="dash-main">
    <header class="dash-topbar" id="dashTopbar"></header>
<script src="js/dash.js"></script>

    <main class="dash-content">
<div class="dash-page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap;">
  <div>
    <h1>My Job Posts</h1>
    <p>Every role you've posted, who applied, and what to do next.</p>
  </div>
  <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
    <a href="ai-match" class="btn btn-outline-primary"><i class="fas fa-magic"></i> AI Match</a>
    <a href="post-job" target="_blank" rel="noopener" class="btn btn-primary"><i class="fas fa-plus"></i> Post a Job</a>
  </div>
</div>

<div class="stat-card-grid" id="jobStats"></div>

<div class="seg-tabs" id="jobTabs" style="margin-top:1.5rem;"></div>
<div id="jobList"></div>
    </main>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
  const fmtDay = t => new Date(Number(t)).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const $ = id => document.getElementById(id);

  const STATUS_LABEL = { open: 'Open', closed: 'Closed', flagged: 'Under review', removed: 'Removed' };
  const STATUS_PILL  = { open: 'active', closed: 'closed', flagged: 'pending', removed: 'rejected' };
  const GROUPS = {
    all:     { label: 'All',    match: () => true },
    open:    { label: 'Open',   match: j => j.status === 'open' },
    closed:  { label: 'Closed', match: j => j.status === 'closed' },
    flagged: { label: 'Under review', match: j => j.status === 'flagged' },
  };

  let jobs = [];
  let filter = 'all';
  let me = null;

  async function load() {
    try {
      const meRes = await fetch('/api/me');
      if (meRes.status !== 200) { location.href = 'auth?next=my-jobs'; return; }
      me = (await meRes.json()).user;
      if (!me || me.role !== 'client') {
        document.querySelector('.dash-content').innerHTML = '<div class="empty-state"><i class="fas fa-user-lock"></i>My Job Posts is for client accounts.</div>';
        return;
      }
      const r = await fetch('/api/jobs/mine');
      const d = await r.json();
      jobs = d.jobs || [];
    } catch (err) {
      console.error('[my-jobs]', err);
      document.querySelector('.dash-content').innerHTML = '<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i><div>Could not load your jobs. Please refresh.</div></div>';
      return;
    }
    renderAll();
  }

  function renderStats() {
    const open      = jobs.filter(j => j.status === 'open').length;
    const totalApps = jobs.reduce((a, j) => a + (j.applicantCount || 0), 0);
    const needNew   = jobs.reduce((a, j) => a + (j.newCount || 0), 0);
    const stat = (label, num, icon, color, sub) => `
      <div class="stat-card">
        <div class="stat-card-top"><span class="stat-card-label">${label}</span><div class="stat-card-icon" style="background:${color}1a; color:${color};"><i class="fas ${icon}"></i></div></div>
        <div class="stat-card-num">${num}</div>
        <div class="stat-card-change" style="color:var(--text-light);">${sub}</div>
      </div>`;
    $('jobStats').innerHTML =
      stat('Open posts',       open,      'fa-briefcase',    '#4F46E5', `${jobs.length} total`) +
      stat('Total applicants', totalApps, 'fa-user-friends', '#EC4899', 'across all posts') +
      stat('New applications', needNew,   'fa-user-plus',    '#F59E0B', needNew ? '<a href="applicants" style="color:var(--primary);font-weight:600;">Review now</a>' : 'all caught up') +
      stat('Jobs this month',  jobs.filter(j => (Date.now() - Number(j.createdAt)) < 30 * 86400000).length, 'fa-calendar-alt', '#10B981', 'last 30 days');
  }

  function renderTabs() {
    $('jobTabs').innerHTML = Object.entries(GROUPS).map(([key, g]) =>
      `<button type="button" data-filter="${key}" class="${key === filter ? 'active' : ''}">${g.label}<span>${jobs.filter(g.match).length}</span></button>`).join('');
  }

  function renderList() {
    const list = jobs.filter(GROUPS[filter].match);
    if (!list.length) {
      $('jobList').innerHTML = `<div class="empty-state"><i class="fas fa-briefcase"></i>No posts in this list. <a href="post-job" style="color:var(--primary); font-weight:600;">Post a job</a></div>`;
      return;
    }
    $('jobList').innerHTML = list.map(j => {
      const closed = j.status === 'closed' || j.status === 'removed';
      const statusLabel = STATUS_LABEL[j.status] || j.status;
      const statusPill  = STATUS_PILL[j.status]  || 'pending';
      const appCount    = j.applicantCount || 0;
      const newCount    = j.newCount || 0;
      return `
        <div class="item-card${closed ? ' dim' : ''}">
          <div class="item-head">
            <div class="job-logo" style="background:rgba(79,70,229,0.08); width:48px; height:48px;"><i class="fas fa-briefcase" style="color:var(--primary);"></i></div>
            <div class="grow">
              <h3><a href="applicants?job=${encodeURIComponent(j.id)}">${esc(j.title)}</a></h3>
              <p>Posted ${fmtDay(j.createdAt)} · <strong style="color:var(--dark);">${appCount}</strong> applicant${appCount === 1 ? '' : 's'}${newCount ? ` · <span style="color:var(--primary); font-weight:600;">${newCount} new</span>` : ''}</p>
            </div>
            <span class="status-pill ${statusPill}">${statusLabel}</span>
          </div>
          <div class="item-actions">
            <a href="applicants?job=${encodeURIComponent(j.id)}" class="btn btn-primary btn-sm"><i class="fas fa-user-friends"></i> Review applicants</a>
            <a href="job?id=${encodeURIComponent(j.id)}" class="btn btn-outline-primary btn-sm" target="_blank"><i class="fas fa-eye"></i> Preview</a>
            <a href="post-job?id=${encodeURIComponent(j.id)}" class="btn btn-ghost btn-sm"><i class="fas fa-edit"></i> Edit</a>
            ${j.status === 'open'   ? `<button class="btn btn-ghost btn-sm" data-act="close"  data-id="${j.id}" style="color:var(--danger);"><i class="fas fa-door-closed"></i> Close</button>` : ''}
            ${j.status === 'closed' ? `<button class="btn btn-ghost btn-sm" data-act="open"   data-id="${j.id}"><i class="fas fa-door-open"></i> Reopen</button>` : ''}
            ${j.status === 'flagged' ? `<span style="font-size:0.8125rem; color:var(--text-light);">Held by Trust &amp; Safety — edit to re-submit</span>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  function renderAll() { renderStats(); renderTabs(); renderList(); }

  async function patchStatus(id, status, btn) {
    btn.disabled = true;
    try {
      const res = await fetch('/api/jobs/' + encodeURIComponent(id), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });
      const data = await res.json();
      if (!data.ok) { showToast(data.error || 'Could not update.'); btn.disabled = false; return; }
      const j = jobs.find(x => x.id === id);
      if (j) j.status = status;
      showToast(status === 'closed' ? 'Job closed.' : 'Job reopened.');
      renderAll();
    } catch (err) { showToast('Network error.'); btn.disabled = false; }
  }

  document.addEventListener('click', e => {
    const tabBtn = e.target.closest('#jobTabs [data-filter]');
    if (tabBtn) { filter = tabBtn.dataset.filter; renderTabs(); renderList(); return; }

    const actBtn = e.target.closest('#jobList [data-act]');
    if (!actBtn) return;
    const act = actBtn.dataset.act;
    const id = actBtn.dataset.id;
    if (act === 'close') {
      if (actBtn.dataset.confirm !== '1') {
        actBtn.dataset.confirm = '1';
        actBtn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Click again to close';
        return;
      }
      patchStatus(id, 'closed', actBtn);
    } else if (act === 'open') {
      patchStatus(id, 'open', actBtn);
    }
  });

  load();
</script>
</body>
</html>
