<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talent Pool — Jobseekers.ph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dash-body">

<div class="dash-wrapper">
  <aside class="dash-sidebar" id="dashSidebar" data-role="client" data-active="talent"></aside>
  <div class="dash-overlay" id="dashOverlay"></div>

  <div class="dash-main">
    <header class="dash-topbar" id="dashTopbar"></header>
<script src="js/va-data.js"></script>
<script src="js/app-data.js"></script>
<script src="js/dash.js"></script>

    <main class="dash-content">
<div class="dash-page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap;">
  <div>
    <h1>Talent Pool</h1>
    <p>Keep your favourite VAs within reach. Invite them to a new post in one click.</p>
  </div>
  <a href="find-vas" class="btn btn-primary"><i class="fas fa-search"></i> Browse VAs</a>
</div>

<div class="stat-card-grid" id="poolStats"></div>

<div class="dash-card" style="margin:1.25rem 0; padding:1rem;">
  <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
    <input type="text" id="searchPool" class="form-control" placeholder="Search by name, skill or location…" style="max-width:360px;" />
    <select id="sortPool" class="filter-sel" style="margin-left:auto;">
      <option value="recent">Sort: Recently saved</option>
      <option value="rate">Sort: Lowest rate</option>
      <option value="rating">Sort: Top rated</option>
    </select>
  </div>
</div>

<div id="poolList"></div>

<div id="inviteModal" class="inline-panel" hidden style="position:fixed; inset:0; margin:auto; max-width:460px; height:fit-content; z-index:100; background:#fff; box-shadow:0 20px 60px rgba(0,0,0,0.2);">
  <strong style="color:var(--dark);"><i class="fas fa-paper-plane" style="color:var(--primary);"></i> Invite <span id="inviteName"></span> to apply</strong>
  <p style="font-size:0.8125rem; color:var(--text-light); margin:0.5rem 0 0.75rem;">They'll get a message with the job link. No application fee counts against their monthly cap.</p>
  <div class="form-group" style="margin-bottom:0.75rem;">
    <label class="form-label" for="inviteJob">Job post</label>
    <select id="inviteJob" class="form-control"></select>
  </div>
  <div class="form-group" style="margin-bottom:0.75rem;">
    <label class="form-label" for="inviteMsg">Message</label>
    <textarea id="inviteMsg" class="form-control form-textarea" style="min-height:80px;"></textarea>
  </div>
  <div style="display:flex; gap:0.5rem;"><button class="btn btn-primary btn-sm" id="inviteSend"><i class="fas fa-paper-plane"></i> Send invite</button><button class="btn btn-ghost btn-sm" id="inviteCancel">Cancel</button></div>
</div>
<div id="inviteBackdrop" hidden style="position:fixed; inset:0; background:rgba(15,23,42,0.4); z-index:99;"></div>
    </main>
  </div>
</div>

<script src="js/main.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let search = '';
  let sort = 'recent';
  let inviteTarget = null;  // { id: favoriteId, vaId, slug, name }
  let favorites = [];
  let jobs = [];

  async function load() {
    try {
      const [fRes, jRes] = await Promise.all([
        fetch('/api/favorites', { cache: 'no-store' }),
        fetch('/api/jobs/mine', { cache: 'no-store' }),
      ]);
      if (fRes.status === 401) { location.href = 'auth'; return; }
      if (fRes.ok) favorites = (await fRes.json()).favorites || [];
      if (jRes.ok) jobs = (await jRes.json()).jobs || [];
    } catch (e) {}
    renderAll();
  }

  function entryName(f) {
    if (f.va) return ((f.va.firstName || '') + ' ' + (f.va.lastName || '')).trim() || 'VA';
    return f.savedVaSlug || 'Saved VA';
  }
  function entryTitle(f) {
    if (f.va) return f.va.title || f.va.skill || 'Virtual Assistant';
    return 'Virtual Assistant';
  }
  function entryCity(f) { return (f.va && f.va.city) || ''; }
  function entryAvatar(f) {
    if (f.savedVaId) return '/api/avatar/' + encodeURIComponent(f.savedVaId);
    return 'https://ui-avatars.com/api/?size=100&background=E2E8F0&color=4F46E5&name=' + encodeURIComponent(entryName(f));
  }

  function renderStats() {
    const openJobs = jobs.filter(j => j.status === 'open').length;
    const stat = (label, num, icon, color, sub) => `
      <div class="stat-card">
        <div class="stat-card-top"><span class="stat-card-label">${label}</span><div class="stat-card-icon" style="background:${color}1a; color:${color};"><i class="fas ${icon}"></i></div></div>
        <div class="stat-card-num">${num}</div>
        <div class="stat-card-change" style="color:var(--text-light);">${sub}</div>
      </div>`;
    $('poolStats').innerHTML =
      stat('Saved VAs', favorites.length, 'fa-star', '#F59E0B', 'in your talent pool') +
      stat('Directory saves', favorites.filter(f => !f.savedVaId).length, 'fa-bookmark', '#10B981', 'from directory') +
      stat('Jobseekers VAs', favorites.filter(f => f.savedVaId).length, 'fa-user-check', '#EC4899', 'signed-up accounts') +
      stat('Open roles to invite to', openJobs, 'fa-briefcase', '#4F46E5', 'ready for invites');
  }

  function filtered() {
    const q = search.trim().toLowerCase();
    let list = favorites.slice();
    if (q) list = list.filter(f => (entryName(f) + ' ' + entryTitle(f) + ' ' + entryCity(f)).toLowerCase().includes(q));
    if (sort === 'rate') list.sort((a, b) => a.createdAt - b.createdAt);
    else list.sort((a, b) => b.createdAt - a.createdAt);
    return list;
  }

  function renderList() {
    const list = filtered();
    $('poolList').innerHTML = list.map(f => `
      <div class="item-card">
        <div class="item-head">
          <img src="${esc(entryAvatar(f))}" alt="" onerror="this.src='https://ui-avatars.com/api/?size=100&background=E2E8F0&color=4F46E5&name=${encodeURIComponent(entryName(f))}'" />
          <div class="grow">
            <h3>${esc(entryName(f))}</h3>
            <p>${esc(entryTitle(f))}${entryCity(f) ? ' · ' + esc(entryCity(f)) : ''}</p>
            ${f.note ? `<p style="font-size:0.8125rem; color:var(--text-light); margin-top:0.25rem;"><i class="fas fa-sticky-note"></i> ${esc(f.note)}</p>` : ''}
          </div>
        </div>
        <div class="item-actions">
          ${f.savedVaId ? `<button class="btn btn-primary btn-sm" data-act="invite" data-id="${f.id}" data-vaid="${f.savedVaId}" data-name="${esc(entryName(f))}"><i class="fas fa-paper-plane"></i> Message</button>` : ''}
          ${f.savedVaId ? `<a href="messages?as=client&to=${encodeURIComponent(f.savedVaId)}" class="btn btn-outline-primary btn-sm"><i class="fas fa-comment"></i> Message</a>` : ''}
          <a href="${f.savedVaSlug ? '/' + encodeURIComponent(f.savedVaSlug) : 'va-profile?id=' + encodeURIComponent(f.savedVaId || '')}" class="btn btn-ghost btn-sm"><i class="fas fa-eye"></i> View profile</a>
          <button class="btn btn-ghost btn-sm" data-act="remove" data-id="${f.id}" style="color:var(--danger);"><i class="fas fa-star" style="opacity:0.5;"></i> Remove</button>
        </div>
      </div>`).join('') || `<div class="empty-state"><i class="fas fa-star"></i>No saved VAs yet. Click the star on any VA profile to save them. <a href="find-vas" style="color:var(--primary); font-weight:600;">Browse VAs</a></div>`;
  }

  function renderAll() { renderStats(); renderList(); }

  function openInvite(vaId, name) {
    inviteTarget = { vaId, name };
    $('inviteName').textContent = name;
    const openJobs = jobs.filter(j => j.status === 'open');
    $('inviteJob').innerHTML = openJobs.length
      ? openJobs.map(j => `<option value="${j.id}">${esc(j.title)}</option>`).join('')
      : '<option disabled>No open roles — post a job first</option>';
    $('inviteMsg').value = `Hi ${name.split(' ')[0]} — I'm hiring and your profile stood out. Would you be open to chatting about a role?`;
    $('inviteModal').hidden = false;
    $('inviteBackdrop').hidden = false;
  }
  function closeInvite() { $('inviteModal').hidden = true; $('inviteBackdrop').hidden = true; inviteTarget = null; }

  $('searchPool').addEventListener('input', e => { search = e.target.value; renderList(); });
  $('sortPool').addEventListener('change', e => { sort = e.target.value; renderList(); });
  $('inviteBackdrop').addEventListener('click', closeInvite);
  $('inviteCancel').addEventListener('click', closeInvite);
  $('inviteSend').addEventListener('click', async () => {
    if (!inviteTarget) return;
    const jobId = $('inviteJob').value || null;
    const msg = $('inviteMsg').value.trim();
    if (!msg) { showToast && showToast('Write a short message first.'); return; }
    try {
      const tr = await fetch('/api/threads', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ otherId: inviteTarget.vaId, jobId }),
      });
      const td = await tr.json();
      if (!td.ok) { showToast && showToast(td.error || 'Could not open thread.'); return; }
      await fetch('/api/threads/' + encodeURIComponent(td.id) + '/messages', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ body: msg }),
      });
      showToast && showToast(`Message sent to ${inviteTarget.name}.`);
      closeInvite();
    } catch (e) {
      showToast && showToast('Could not send message.');
    }
  });

  $('poolList').addEventListener('click', async e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    if (btn.dataset.act === 'invite') { openInvite(btn.dataset.vaid, btn.dataset.name); return; }
    if (btn.dataset.act === 'remove') {
      const favId = btn.dataset.id;
      favorites = favorites.filter(f => f.id !== favId);
      renderAll();
      await fetch('/api/favorites/' + encodeURIComponent(favId), { method: 'DELETE' });
      showToast && showToast('Removed from Talent Pool');
    }
  });

  load();
</script>
</body>
</html>
